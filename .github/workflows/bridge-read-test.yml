name: Bridge read test (temporary)
on:
  push:
    branches: [ 'test/bridge-read' ]
jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Read Bridge (no Airtable writes)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          python3 - <<'PY'
          src=open('index.js').read()
          i=src.rindex('main().catch(')
          src=src[:i]+"\nconst r = await getBridgeData();\nconsole.log('RESULT', JSON.stringify(r));\n"
          open('bridge_test.mjs','w').write(src)
          PY
          node bridge_test.mjs > bridge-test-output.txt 2>&1 || true
          A=0xF3841e27b27B6bC78Ea4ad2dC9a1882D04F39f93
          echo "== token balances ==" >> bridge-test-output.txt
          curl -s "https://base.blockscout.com/api/v2/addresses/$A/token-balances" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(x['token'].get('symbol'),x['token'].get('address_hash') or x['token'].get('address'),x['value'],x['token'].get('decimals')) for x in d]" >> bridge-test-output.txt 2>&1
          echo "== token transfers ==" >> bridge-test-output.txt
          curl -s "https://base.blockscout.com/api/v2/addresses/$A/token-transfers" | python3 -c "
          import sys,json;d=json.load(sys.stdin)
          for x in d.get('items',[])[:25]:
            t=x['token'];print(x['timestamp'],t.get('symbol'),'from',x['from']['hash'],'to',x['to']['hash'],x['total'].get('value'),x.get('method'))
          " >> bridge-test-output.txt 2>&1
          cat bridge-test-output.txt
      - name: Save output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bridge-test-output.txt
          git commit -m "bridge read test output"
          git push
